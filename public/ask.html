<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask · Prometheus on Gemini</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
<style>
  .simple { max-width: 760px; margin: 0 auto; padding: 40px 16px 96px; }
  .simple h1 { font-size: 30px; margin: 0 0 20px; }
  .simple textarea { width: 100%; min-height: 110px; box-sizing: border-box; font: inherit; font-size: 17px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; resize: vertical; }
  .simple .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .simple select { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: inherit; }
  .simple button.go { margin-left: auto; font: inherit; font-size: 15px; padding: 8px 20px; border-radius: 6px; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; }
  .simple button.go:disabled { opacity: .5; cursor: default; }
  .status { margin: 28px 0 8px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 14px; }
  .status .now { font-size: 16px; }
  .status .nums { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .status a { color: inherit; }
  .q { font-size: 22px; line-height: 1.3; margin: 28px 0 0; }
  .answer { margin-top: 24px; font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
  .answer table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; }
  .answer th, .answer td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .answer a.tag { font-family: var(--mono); font-size: 11px; text-decoration: none; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin: 0 1px; white-space: nowrap; }
  .past { margin-top: 48px; font-size: 14px; }
  .past a { color: inherit; display: block; padding: 7px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .past span { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-right: 8px; }
  .muted { color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3a9a5c; margin-right: 8px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main class="simple">
  <h1>Ask one question.</h1>
  <form id="f">
    <textarea name="question" required minlength="8" placeholder="A question worth 16 to 128 agents arguing about it"></textarea>
    <div class="row">
      <select name="size" aria-label="Team size">
        <option value="8,12">8 agents · about 12 min</option>
        <option value="16,20" selected>16 agents · about 15 min</option>
        <option value="64,40">64 agents · about 30 min</option>
        <option value="128,60">128 agents · about 45 min</option>
      </select>
      <select name="model" aria-label="Agent model">
        <option value="gemini-4-hydrogen">Gemini 4 Hydrogen</option>
        <option value="gemini-4-neon">Gemini 4 Neon</option>
      </select>
      <button class="go" type="submit">Start</button>
    </div>
    <div class="row"><label class="muted" style="font-size:14px">Attach files (data, logs, code; up to 25 MB): <input type="file" name="files" multiple style="font:inherit;font-size:13px;margin-left:6px"></label></div>
    <div class="row" id="runcode" hidden><label class="muted" style="font-size:14px">Run code: <input name="run_code" autocomplete="off" spellcheck="false" placeholder="needed to start a run here" style="font:inherit;font-size:14px;margin-left:6px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit"></label></div>
    <div class="muted" id="err" style="margin-top:10px"></div>
  </form>
  <section id="run" hidden>
    <p class="q" id="q"></p>
    <div class="status"><div class="now" id="now"></div><div class="nums" id="nums"></div></div>
    <article class="answer" id="answer"></article>
  </section>
  <section class="past" id="past" hidden><div class="muted" style="margin-bottom:6px">Earlier questions</div><div id="pastlist"></div></section>
</main>
<script type="module">
import { marked } from '/vendor/marked.esm.js';
import { protectMath } from '/mathmd.js';
import { follow } from '/stream.js';
const $ = (s) => document.querySelector(s);
// served through the sharednet.ai forward, the page lives under a base path and starting a run takes the run code
const BASE = window.GP?.base || '';
const FORWARDED = !!window.GP?.forwarded;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PHASE = { plan: 'Splitting the question', research: 'Agents are researching', crosscheck: 'Agents are cross-checking each other', redteam: 'The red team is re-opening sources', fix: 'Fixing what the red team found', gate: 'Checking the evidence', write: 'Writing the answer', judge: 'An independent judge is reading it', done: 'Done' };
let es = null, timer = null;

function render(md, id) {
  const math = protectMath(md);
  const html0 = marked.parse(math.src.replace(/~/g, '\\~').replace(/\[((?:C\d+-\d+)(?:\s*[,;]\s*C\d+-\d+)*)\]/g, (_, ids) => ids.split(/\s*[,;]\s*/).map((c) => `<a class="tag" href="/run/${id}#report" title="See the sources behind ${c}">${c}</a>`).join('')));
  const html = math.restore(html0);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,form').forEach((n) => n.remove());
  doc.querySelectorAll('*').forEach((n) => [...n.attributes].forEach((a) => { if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name); }));
  doc.querySelectorAll('a:not(.tag)').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  $('#answer').innerHTML = doc.body.innerHTML;
}

function open(id) {
  if (es) es.close();
  clearInterval(timer);
  $('#run').hidden = false;
  $('#answer').innerHTML = '';
  const S = { phase: '', agents: 0, searches: 0, pages: new Set(), claims: 0, checks: 0, start: null, done: null, working: 0, report: false };
  const paint = () => {
    const mins = S.start ? (((S.done ? Date.parse(S.done.at) : Date.now()) - S.start) / 60000) : 0;
    const label = S.done ? `Done · ${esc(S.done.status)}` : (PHASE[S.phase] || 'Starting');
    $('#now').innerHTML = `${S.done ? '' : '<span class="dot"></span>'}${label}${S.done ? '' : ` <span class="muted">· ${mins.toFixed(0)} min</span>`}`;
    $('#nums').innerHTML = `${S.agents} agents · ${S.searches} searches · ${S.pages.size} pages read · ${S.claims} claims · ${S.checks} red-team checks${S.done ? ` · ${mins.toFixed(1)} min` : ''} · <a href="${BASE}/run/${id}">watch the agents</a>${S.report ? ` · <a href="/api/runs/${id}/file/report.md" download="answer-${id}.md">download .md</a>` : ''}`;
  };
  const loadReport = async () => {
    const r = await fetch(`${BASE}/api/runs/${id}/file/report.md`, { cache: 'no-store' });
    if (r.ok) { S.report = true; render(await r.text(), id); paint(); }
  };
  const onEvent = (ev) => {
    if (ev.t === 'run') { Object.assign(S, { searches: 0, pages: new Set(), claims: 0, checks: 0, done: null }); $('#q').textContent = ev.question; S.start = Date.parse(ev.started_at); S.agents = (ev.seats || []).filter((s) => s.role === 'researcher' || s.role === 'redteam').length; document.title = `${ev.question} · Prometheus on Gemini`; }
    else if (ev.t === 'phase') S.phase = ev.name;
    else if (ev.t === 'turn' && ev.status === 'completed') { S.searches += (ev.searches || []).length; for (const u of ev.urls || []) S.pages.add(u); }
    else if (ev.t === 'ledger') for (const r of ev.rows || []) { if (r.type === 'claim') S.claims++; if (r.type === 'check') S.checks++; }
    else if (ev.t === 'report') loadReport();
    else if (ev.t === 'done') { S.done = ev; S.phase = 'done'; es?.close(); clearInterval(timer); if (!S.report) loadReport(); }
    paint();
  };
  es = follow(BASE, id, { onEvent });
  timer = setInterval(paint, 15000);
  paint();
}

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button');
  const [agents, minutes] = f.size.value.split(',').map(Number);
  btn.disabled = true; $('#err').textContent = '';
  try {
    const b64 = (file) => new Promise((ok, bad) => { const rd = new FileReader(); rd.onload = () => ok(String(rd.result).split(',')[1] || ''); rd.onerror = bad; rd.readAsDataURL(file); });
    const attachments = await Promise.all([...f.files.files].map(async (x) => ({ name: x.name, data: await b64(x) })));
    const code = FORWARDED ? f.run_code.value.trim() : '';
    const r = await fetch(`${BASE}/api/runs`, { method: 'POST', headers: { 'content-type': 'application/json', ...(code ? { 'x-run-code': code } : {}) }, body: JSON.stringify({ question: f.question.value.trim(), agents, minutes, seat_model: f.model.value, baseline: false, ...(attachments.length ? { attachments } : {}), ...(agents > 16 ? {} : { max_rounds: 2 }) }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 413) throw new Error('The attached files are too large to send through this address.');
    if (!r.ok || !j.id) throw new Error(j.error || `Server said ${r.status}`);
    if (code) { try { localStorage.setItem('gp_run_code', code); } catch {} }
    history.pushState(null, '', `${BASE}/ask?run=${j.id}`);
    open(j.id);
  } catch (err) { $('#err').textContent = String(err.message || err); }
  btn.disabled = false;
});
$('#f').question.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#f').requestSubmit(); } });

if (FORWARDED) { $('#runcode').hidden = false; try { $('#f').run_code.value = localStorage.getItem('gp_run_code') || ''; } catch {} }
const id = new URLSearchParams(location.search).get('run');
if (id) open(id);
fetch(`${BASE}/api/runs`).then((r) => r.json()).then((runs) => {
  if (!runs.length) return;
  $('#past').hidden = false;
  $('#pastlist').innerHTML = runs.slice(0, 12).map((r) => `<a href="${BASE}/ask?run=${esc(r.id)}"><span>${esc(r.status)}</span>${esc(r.question.slice(0, 110))}</a>`).join('');
}).catch(() => {});
</script>
</body>
</html>
